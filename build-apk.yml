name: Construire l'APK Ma Sorcière

# Se lance a chaque push, et manuellement depuis l'onglet Actions.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le dossier android/
        run: flutter create --org com.herdy --project-name ma_sorciere --platforms=android .

      - name: Restaurer le code source de l'application
        run: git checkout -- lib pubspec.yaml test || true

      - name: Appliquer les patchs Android
        run: python3 tool/patch_android.py

      - name: Dépendances
        run: flutter pub get

      - name: Analyse et tests
        run: |
          flutter analyze || true
          flutter test || true

      - name: Compiler l'APK
        run: flutter build apk --release

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ma-sorciere-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
