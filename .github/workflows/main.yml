name: Construire Ma Sorcière

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Créer Android
        run: flutter create --org com.herdy --project-name ma_sorciere --platforms=android .

      - name: Restaurer les fichiers du projet
        run: git checkout -- lib pubspec.yaml test || true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Compiler l'APK
        run: flutter build apk --release

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ma-sorciere-apk
          path: build/app/outputs/flutter-apk/app-release.apk
